<title>Jus Bidara Hitam Pelanggan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700;800&display=swap">
<style>
/* Layout: alat CRM satu kolum untuk telefon — ringkasan atas, tab follow-up, senarai kad pelanggan, borang tambah dalam panel bawah */
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1d1a14; --muted:#6e6555; --line:#e3dccd;
  --brand:#1d1a14; --gold:#b77f0f; --goldsoft:#f6e7c4; --ongold:#1d1a14;
  --late:#c0352b; --latebg:#fbe9e7; --today:#a85a06; --todaybg:#fdf0dc; --ok:#2d7a3e; --okbg:#e6f3e8; --soon:#2f5aa0; --soonbg:#e8eef9;
  --scrim:rgba(20,16,8,.5);
  --band:#1b1813; --band2:#2a241a; --onband:#f6efe0; --bandmuted:#c9b98f; --bandgold:#f4c65a;
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:"Anton","Impact","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13120e; --card:#1d1b16; --ink:#f3ecdc; --muted:#b3a68b; --line:#3a3427;
  --brand:#f4c65a; --gold:#e3a92f; --goldsoft:#3a2d10; --ongold:#16130c;
  --late:#ff8a7e; --latebg:#3a1a17; --today:#f2b062; --todaybg:#33240f; --ok:#6fcf86; --okbg:#16301c; --soon:#93b3ff; --soonbg:#1b2440;
  --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13120e; --card:#1d1b16; --ink:#f3ecdc; --muted:#b3a68b; --line:#3a3427;
  --brand:#f4c65a; --gold:#e3a92f; --goldsoft:#3a2d10; --ongold:#16130c;
  --late:#ff8a7e; --latebg:#3a1a17; --today:#f2b062; --todaybg:#33240f; --ok:#6fcf86; --okbg:#16301c; --soon:#93b3ff; --soonbg:#1b2440;
  --scrim:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 110px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.band{background:radial-gradient(ellipse at 15% 0%,var(--band2),var(--band) 70%);color:var(--onband);border-bottom:3px solid var(--bandgold)}
.band .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 18px;display:flex;align-items:center;gap:14px}
.logo{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--bandgold),0 8px 20px rgba(0,0,0,.45);display:block}
.brandtxt{min-width:0;flex:1}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--bandgold)}
h1{margin:2px 0 0;font:400 1.7rem/1.02 var(--fd);letter-spacing:.5px;text-transform:uppercase;color:var(--onband);text-wrap:balance}
.status{display:block;font-size:.78rem;color:var(--bandmuted);margin-top:4px}
.sub{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--line)}
.stat.s-c,.stat.s-o,.stat.s-b,.stat.s-r{border-top-color:var(--gold)}
.stat b{display:block;font:400 1.7rem/1.1 var(--fd);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.late b{color:var(--late)} .stat.today b{color:var(--today)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .n{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tools input{flex:1 1 200px;min-width:0}
.list{display:grid;gap:10px}
.cust{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.cust.late{border-left-color:var(--late)} .cust.today{border-left-color:var(--today)} .cust.soon{border-left-color:var(--soon)} .cust.done{border-left-color:var(--ok)}
.row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.badge{flex:0 0 auto;font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-late{background:var(--latebg);color:var(--late)} .b-today{background:var(--todaybg);color:var(--today)} .b-soon{background:var(--soonbg);color:var(--soon)} .b-done{background:var(--okbg);color:var(--ok)} .b-mute{background:var(--bg);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.86rem;margin-top:4px}
.meta b{color:var(--ink);font-weight:700}
.note{margin-top:6px;font-size:.85rem;background:var(--bg);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:700;font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.wa{background:#1fae55;border-color:#1fae55;color:#fff}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--late)}
.empty{text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:28px 16px}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;background:var(--gold);color:var(--ongold);font-weight:800;padding:14px 26px;white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);font-size:1rem}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0 0 4px;font-size:1.15rem}
.sheet .x{float:right;border:0;background:var(--bg);width:34px;height:34px;border-radius:50%}
.form{display:grid;gap:10px;margin-top:10px}
.form label{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted)}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;text-align:center;font-weight:800}
.pk small{display:block;font-weight:600;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.fu{background:var(--soonbg);color:var(--soon);border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:700}
.hint{font-size:.76rem;color:var(--muted);font-weight:500}
.paste{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px}
.paste summary{cursor:pointer;font-weight:800;font-size:.9rem;color:var(--gold)}
.paste textarea{margin-top:8px;min-height:130px}
.err{color:var(--late);font-size:.85rem;font-weight:700}
.confirm{background:var(--latebg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule{font-size:.8rem;color:var(--muted);margin-top:18px;text-align:center}
.vchk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.vchk .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vchk label{font-weight:800;font-size:.9rem;flex:1 1 100%}
.vchk input{flex:1 1 160px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.vres{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:.9rem;display:grid;gap:6px}
.vres.ok{background:var(--okbg);color:var(--ok)} .vres.bad{background:var(--latebg);color:var(--late)} .vres.used{background:var(--todaybg);color:var(--today)}
.vres b{color:inherit}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:1px;color:var(--ink);background:var(--goldsoft);border-radius:6px;padding:1px 7px}
.vstate{font-size:.8rem;font-weight:700}
.vstate.u{color:var(--today)} .vstate.f{color:var(--ok)}
.vhint{font-size:.8rem;font-weight:700;margin-top:2px}
.vhint.ok{color:var(--ok)} .vhint.bad{color:var(--late)}
.locked{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);margin-top:16px}
</style>

<script>
/* ===== tetapan ===== */
const PRICE = { 1: 30, 2: 58, 3: 69 };           // harga pakej
const POS_SEMENANJUNG = { 1: 8, 2: 0, 3: 0 };    // 2 & 3 botol pos percuma Semenanjung
const POS_TIMUR = 18;                            // Sabah / Sarawak / Labuan, semua pakej
const EAST = ["Sabah", "Sarawak", "W.P. Labuan"];
const STATES = ["Johor","Kedah","Kelantan","Melaka","Negeri Sembilan","Pahang","Perak","Perlis","Pulau Pinang","Selangor","Terengganu","W.P. Kuala Lumpur","W.P. Putrajaya","Sabah","Sarawak","W.P. Labuan"];
const COL = "customers";
const VOUCHER_RM = 5;                            // diskaun voucher pembelian kedua
const CODE_CHARS = "ACDEFGHJKMNPQRTUVWXY34679"; // tiada huruf/nombor yang mudah keliru bila ditulis tangan

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const addDays = (s, n) => { const t = new Date((dayNum(s) + n) * 864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
const fmt = s => { if (!s) return "-"; const [y, m, d] = s.split("-"); return `${+d} ${["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"][+m - 1]} ${y}`; };
const isEast = n => EAST.includes(n);
const total = (q, n) => (PRICE[q] ?? 0) + (isEast(n) ? POS_TIMUR : (POS_SEMENANJUNG[q] ?? 0));
const normTel = t => { let d = String(t || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "6" + d; else if (d && !d.startsWith("6")) d = "60" + d; return d; };

for (const s of STATES) { $("#f-negeri").insertAdjacentHTML("beforeend", `<option>${s}</option>`); $("#fstate").insertAdjacentHTML("beforeend", `<option>${s}</option>`); }
$("#f-negeri").insertAdjacentHTML("afterbegin", `<option value="">Pilih negeri</option>`); $("#f-negeri").value = "";

let db = null, rows = [], tab = "all", editing = null, writable = true, downloads = null;

/* ===== paparan ===== */
const normCode = c => { let x = String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); if (x.startsWith("JBH")) x = x.slice(3); return x.length === 4 ? "JBH-" + x : ""; };
function newCode() {
  const used = new Set(rows.map(r => r.kodVoucher));
  for (let i = 0; i < 200; i++) {
    const a = new Uint32Array(4); crypto.getRandomValues(a);
    const c = "JBH-" + [...a].map(n => CODE_CHARS[n % CODE_CHARS.length]).join("");
    if (!used.has(c)) return c;
  }
  return "JBH-" + Date.now().toString(36).slice(-4).toUpperCase();
}
const findCode = c => rows.find(r => r.kodVoucher && r.kodVoucher === normCode(c));
function voucherInfo(code, selfId) {
  const c = normCode(code);
  if (!c) return { st: "bad", msg: "Format kod tak betul. Kod ada 4 huruf/nombor selepas JBH-, cth. JBH-7K4P." };
  const r = findCode(c);
  if (!r) return { st: "bad", msg: `Kod ${c} tiada dalam rekod. Jangan beri diskaun.` };
  if (r.id === selfId) return { st: "bad", msg: "Ini kod untuk order ini sendiri, bukan kod order sebelumnya." };
  if (r.voucherDigunakan) return { st: "used", r, msg: `Kod ${c} SUDAH DIGUNAKAN pada ${fmt(r.voucherDigunakan)}${r.voucherDigunakanOleh ? " oleh " + r.voucherDigunakanOleh : ""}. Jangan beri diskaun lagi.` };
  return { st: "ok", r, msg: `Kod ${c} SAH dan belum digunakan. Diskaun RM${VOUCHER_RM} boleh diberi.` };
}
const custKey = r => normTel(r.tel) || String(r.nama || "").trim().toLowerCase();
const rm = n => "RM" + (Math.round(n * 100) / 100).toLocaleString("en-MY");
function render() {
  const q = $("#q").value.trim().toLowerCase(), fs = $("#fstate").value;
  const counts = {}; rows.forEach(r => { const k = custKey(r); counts[k] = (counts[k] || 0) + 1; });
  const ym = todayStr().slice(0, 7);
  const every = [...rows].sort((a, b) => (b.tarikhBeli || "").localeCompare(a.tarikhBeli || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
  const month = every.filter(r => (r.tarikhBeli || "").startsWith(ym));
  const repeat = every.filter(r => counts[custKey(r)] > 1);
  $("#st-cust").textContent = Object.keys(counts).length;
  $("#st-ord").textContent = rows.length;
  $("#st-btl").textContent = rows.reduce((s, r) => s + (+r.botol || 0), 0);
  $("#st-rm").textContent = rm(rows.reduce((s, r) => s + (+r.harga || 0), 0));
  $("#n-all").textContent = every.length; $("#n-month").textContent = month.length; $("#n-repeat").textContent = repeat.length;
  const pick = { all: every, month, repeat }[tab];
  const shown = pick.filter(r => (!fs || r.negeri === fs) && (!q || [r.nama, r.tel, r.bandar, r.negeri, r.alamat, r.nota, r.kodVoucher, r.voucherDipakai].join(" ").toLowerCase().includes(q)));
  const list = $("#list");
  if (!rows.length) {
    list.innerHTML = `<div class="empty"><b>Belum ada pelanggan</b>Tekan <b style="display:inline">+ Tambah pembelian</b> selepas setiap order disahkan, atau tampal terus mesej order dari website.</div>`;
    return;
  }
  if (!shown.length) {
    const msg = { all: "Tiada padanan.", month: "Belum ada order bulan ini.", repeat: "Belum ada pelanggan yang beli lebih sekali." }[tab];
    list.innerHTML = `<div class="empty">${q || fs ? "Tiada padanan untuk carian ini." : msg}</div>`;
    return;
  }
  list.innerHTML = shown.map(r => {
    const n = counts[custKey(r)];
    return `
    <article class="cust" data-id="${esc(r.id)}">
      <div class="row1"><div class="name">${esc(r.nama)}</div>${n > 1 ? `<span class="badge b-done">Beli ${n} kali</span>` : `<span class="badge b-mute">${esc(r.bayaran || "COD")}</span>`}</div>
      <div class="meta">
        <span>🛒 <b>${fmt(r.tarikhBeli)}</b></span>
        <span>🧴 <b>${esc(r.botol)} botol</b>${r.harga != null && r.harga !== "" ? " · RM" + esc(r.harga) : ""}</span>
        <span>📍 <b>${esc([r.bandar, r.negeri].filter(Boolean).join(", ") || "-")}</b></span>
        <span>📞 <b>${esc(r.tel)}</b></span>
      </div>
      ${r.alamat ? `<div class="note">🏠 ${esc(r.alamat)}</div>` : ""}
      <div class="meta">${r.kodVoucher ? `<span>🎟️ Kod untuk kad: <span class="code">${esc(r.kodVoucher)}</span> ${r.voucherDigunakan ? `<span class="vstate u">· dah digunakan ${fmt(r.voucherDigunakan)}</span>` : `<span class="vstate f">· belum guna</span>`}</span>` : (writable ? `<button class="btn ghost" type="button" data-act="gencode">🎟️ Jana kod voucher</button>` : "")}
      ${r.voucherDipakai ? `<span>✂️ Order ini guna voucher <span class="code">${esc(r.voucherDipakai)}</span> (−RM${VOUCHER_RM})</span>` : ""}</div>
      ${r.nota ? `<div class="note">${esc(r.nota)}</div>` : ""}
      ${writable ? `<div class="acts">
        <a class="btn wa" href="https://wa.me/${normTel(r.tel)}" target="_blank" rel="noopener">WhatsApp</a>
        <button class="btn pri" type="button" data-act="rebuy">+ Order lagi</button>
        <button class="btn ghost" type="button" data-act="edit">Edit</button>
        <button class="btn danger" type="button" data-act="del">Padam</button>
      </div><div class="confirm" data-confirm hidden>Padam rekod ${esc(r.nama)}? <button class="btn danger" type="button" data-act="del-yes">Ya, padam</button><button class="btn" type="button" data-act="del-no">Batal</button></div>` : ""}
    </article>`;
  }).join("");
}

/* ===== tindakan pada kad ===== */
$("#list").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || !db) return;
  const card = b.closest(".cust"), id = card.dataset.id, r = rows.find(x => x.id === id); if (!r) return;
  const ref = db.collection(COL).doc(id);
  const act = b.dataset.act;
  try {
    if (act === "gencode") await ref.update({ kodVoucher: newCode(), updatedAt: new Date().toISOString() });
    if (act === "edit") openSheet(r, "edit");
    if (act === "rebuy") openSheet(r, "rebuy");
    if (act === "del") card.querySelector("[data-confirm]").hidden = false;
    if (act === "del-no") card.querySelector("[data-confirm]").hidden = true;
    if (act === "del-yes") await ref.delete();
  } catch (err) { setStatus(errMsg(err)); }
});

/* ===== borang ===== */
let qty = 1, priceTouched = false;
function autoFill() {
  if (!priceTouched) $("#f-harga").value = total(qty, $("#f-negeri").value) - (vState && vState.st === "ok" ? VOUCHER_RM : 0);
}
function setQty(n) {
  qty = n;
  document.querySelectorAll(".pk").forEach(p => p.setAttribute("aria-pressed", +p.dataset.q === n));
  autoFill();
}
document.querySelectorAll(".pk").forEach(p => p.addEventListener("click", () => { priceTouched = false; setQty(+p.dataset.q); }));
$("#f-negeri").addEventListener("change", autoFill);
$("#f-harga").addEventListener("input", () => { priceTouched = true; });

let vState = null;
function checkVoucherField() {
  const raw = $("#f-voucher").value.trim(), h = $("#vhint");
  if (!raw) { vState = null; h.textContent = ""; h.className = "vhint"; autoFill(); return; }
  vState = voucherInfo(raw, editing);
  h.textContent = (vState.st === "ok" ? "✓ " : "✕ ") + vState.msg + (vState.st === "ok" ? ` Jumlah ditolak RM${VOUCHER_RM}.` : "");
  h.className = "vhint " + (vState.st === "ok" ? "ok" : "bad");
  autoFill();
}
$("#f-voucher").addEventListener("input", checkVoucherField);
function openSheet(r, mode) {
  editing = mode === "edit" ? r.id : null;
  $("#sheetTitle").textContent = mode === "edit" ? "Edit rekod" : mode === "rebuy" ? "Pembelian semula" : "Tambah pembelian";
  $("#sheetSub").textContent = mode === "rebuy" ? `Order baru untuk ${r.nama}. Rekod lama kekal sebagai sejarah.` : "Isi maklumat pembeli yang dah sahkan order.";
  $("#pasteBox").hidden = mode === "edit" || mode === "rebuy"; $("#pasteBox").open = false; $("#pasteTxt").value = ""; $("#pasteErr").hidden = true;
  $("#f-nama").value = r?.nama || ""; $("#f-tel").value = r?.tel || ""; $("#f-negeri").value = r?.negeri || ""; $("#f-bandar").value = r?.bandar || "";
  $("#f-alamat").value = r?.alamat || ""; $("#f-bayar").value = r?.bayaran || "COD"; $("#f-nota").value = r?.nota || "";
  $("#f-tarikh").value = mode === "edit" ? r.tarikhBeli : todayStr();
  priceTouched = mode === "edit";
  if (mode === "edit") $("#f-harga").value = r.harga ?? "";
  $("#vfield").hidden = mode === "edit"; $("#f-voucher").value = ""; vState = null; $("#vhint").textContent = "";
  setQty(mode === "edit" ? (+r.botol || 1) : 1);
  $("#formErr").hidden = true;
  $("#sheet").hidden = $("#scrim").hidden = false; document.body.style.overflow = "hidden";
  setTimeout(() => $("#f-nama").focus(), 50);
}
function closeSheet() { $("#sheet").hidden = $("#scrim").hidden = true; document.body.style.overflow = ""; }
$("#addBtn").addEventListener("click", () => openSheet(null, "new"));
$("#closeSheet").addEventListener("click", closeSheet); $("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* tampal mesej order website (format butang tempah jusbidarahitam.com) */
function parseOrder(t) {
  const g = label => (t.match(new RegExp("\\*?" + label + ":\\*?[ \\t]*(.+)", "i")) || [])[1]?.trim() || "";
  const nama = g("Nama"), tel = g("Tel(?:efon)?"), alamat = g("Alamat"), pakej = g("Pakej"), bayar = g("Bayaran");
  const jum = (g("Jumlah").match(/RM\s*([\d.]+)/i) || [])[1] || "";
  const st = [...STATES].sort((a, b) => b.length - a.length).find(s => alamat.toLowerCase().endsWith(s.toLowerCase())) || STATES.find(s => alamat.toLowerCase().includes(s.toLowerCase())) || "";
  const segs = alamat.replace(/,?\s*\d{5}\s+[^,]*$/, "").split(",").map(s => s.trim()).filter(Boolean);
  const bandar = segs.length > 1 ? segs[segs.length - 1] : "";
  const q = +(pakej.match(/(\d)\s*botol/i) || [])[1] || 1;
  return { nama, tel, alamat, negeri: st, bandar, qty: q, jumlah: jum, bayar, voucher: g("Kod voucher") };
}
$("#pasteBtn").addEventListener("click", () => {
  const o = parseOrder($("#pasteTxt").value);
  if (!o.nama && !o.tel) { $("#pasteErr").textContent = "Format mesej tak dikenali. Pastikan ada baris Nama: dan Telefon:"; $("#pasteErr").hidden = false; return; }
  $("#pasteErr").hidden = true;
  $("#f-nama").value = o.nama; $("#f-tel").value = o.tel; $("#f-negeri").value = o.negeri; $("#f-bandar").value = o.bandar; $("#f-alamat").value = o.alamat;
  priceTouched = false; $("#f-voucher").value = o.voucher || ""; checkVoucherField(); setQty(o.qty);
  if (/transfer/i.test(o.bayar)) $("#f-bayar").value = "Online Transfer"; else if (/cod/i.test(o.bayar)) $("#f-bayar").value = "COD";
  $("#pasteBox").open = false;
});

$("#form").addEventListener("submit", async e => {
  e.preventDefault(); if (!db) return;
  const v = id => $(id).value.trim();
  const miss = [["#f-nama", "nama"], ["#f-tel", "telefon"], ["#f-negeri", "negeri"], ["#f-tarikh", "tarikh beli"]].filter(([id]) => !v(id));
  if (miss.length) { $("#formErr").textContent = "Sila isi " + miss.map(m => m[1]).join(", ") + "."; $("#formErr").hidden = false; $(miss[0][0]).focus(); return; }
  if (!editing && v("#f-voucher") && (!vState || vState.st !== "ok")) { $("#formErr").textContent = "Kod voucher tak sah atau dah digunakan. Padam kod tu atau semak semula sebelum simpan."; $("#formErr").hidden = false; $("#f-voucher").focus(); return; }
  const now = new Date().toISOString(), tarikh = v("#f-tarikh");
  const body = { nama: v("#f-nama"), tel: v("#f-tel"), negeri: v("#f-negeri"), bandar: v("#f-bandar"), alamat: v("#f-alamat"), botol: qty,
    harga: $("#f-harga").value === "" ? null : +$("#f-harga").value, bayaran: v("#f-bayar"), tarikhBeli: tarikh, nota: v("#f-nota"), updatedAt: now };
  $("#saveBtn").disabled = true;
  try {
    if (editing) {
      await db.collection(COL).doc(editing).update(body);
    } else {
      const used = vState && vState.st === "ok" ? vState.r : null;
      await db.collection(COL).doc().set({ ...body, kodVoucher: newCode(), voucherDigunakan: null, voucherDipakai: used ? used.kodVoucher : null, createdAt: now });
      if (used) await db.collection(COL).doc(used.id).update({ voucherDigunakan: tarikh, voucherDigunakanOleh: `${body.nama} (${body.tel})`, updatedAt: now });
    }
    closeSheet();
  } catch (err) { $("#formErr").textContent = errMsg(err); $("#formErr").hidden = false; }
  finally { $("#saveBtn").disabled = false; }
});

/* ===== semak voucher ===== */
function showVoucher() {
  const raw = $("#vq").value.trim(), box = $("#vres");
  if (!raw) { box.hidden = true; return; }
  const i = voucherInfo(raw, null);
  box.className = "vres " + i.st; box.hidden = false;
  box.innerHTML = `<div><b>${i.st === "ok" ? "✓" : "✕"} ${esc(i.msg)}</b></div>` + (i.r ? `<div>Pemilik kod: <b>${esc(i.r.nama)}</b> · ${esc(i.r.tel)} · ${esc([i.r.bandar, i.r.negeri].filter(Boolean).join(", "))}<br>Order asal: ${fmt(i.r.tarikhBeli)} · ${esc(i.r.botol)} botol. Pastikan nama &amp; alamat pembeli sama dengan pemilik kod.</div>` : "") +
    (i.st === "ok" && writable ? `<div><button class="btn" type="button" id="vmark">Tandakan dah digunakan</button></div>` : "");
}
$("#vgo").addEventListener("click", showVoucher);
$("#vq").addEventListener("keydown", e => { if (e.key === "Enter") showVoucher(); });
$("#vres").addEventListener("click", async e => {
  if (e.target.id !== "vmark" || !db) return;
  const i = voucherInfo($("#vq").value, null); if (i.st !== "ok") return;
  try { await db.collection(COL).doc(i.r.id).update({ voucherDigunakan: todayStr(), voucherDigunakanOleh: "ditanda manual", updatedAt: new Date().toISOString() }); }
  catch (err) { setStatus(errMsg(err)); }
});

/* ===== tab, carian ===== */
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (!t) return; tab = t.dataset.tab; document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t)); render(); });
$("#q").addEventListener("input", render); $("#fstate").addEventListener("change", render);

/* ===== eksport CSV ===== */
$("#exportBtn").addEventListener("click", async () => {
  const cols = ["nama","tel","negeri","bandar","alamat","botol","harga","bayaran","tarikhBeli","kodVoucher","voucherDigunakan","voucherDigunakanOleh","voucherDipakai","nota"];
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.join(","), ...rows.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
  try { await downloads.save({ filename: `jus-bidara-hitam-pelanggan-${todayStr()}.csv`, data: "﻿" + csv }); } catch (_) { setStatus("Muat turun dibatalkan."); }
});

function setStatus(t) { $("#status").textContent = t; }
function errMsg(err) {
  const c = err && err.code;
  if (c === "quota_exceeded") return "Storan penuh. Padam rekod lama dulu.";
  if (c === "invalid_argument" || c === "permission_denied") return "Tak dapat simpan: anda tiada akses untuk ubah rekod.";
  return "Tak dapat simpan sekarang. Cuba lagi sekejap.";
}

/* ===== mula ===== */
render();
(async () => {
  const claude = window.claude;
  if (!claude || !claude.use) { setStatus("Buka page ini dalam Claude untuk guna rekod."); return; }
  const [dbNs, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  downloads = dl; if (downloads) $("#exportBtn").hidden = false;
  if (!dbNs) { setStatus("Rekod tak dapat dibuka di sini. Log masuk ke Claude dahulu."); return; }
  db = dbNs;
  const canEdit = user ? await user.canEdit() : null;
  if (canEdit === false) { writable = false; $("#locked").hidden = false; setStatus(""); render(); return; }
  $("#addBtn").hidden = false; $("#vchk").hidden = false;
  const timer = setTimeout(() => setStatus("Rekod belum dapat dicapai. Semak sambungan internet."), 10000);
  db.collection(COL).onSnapshot(snap => {
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus(`${rows.length} rekod · dikemas kini ${new Date().toLocaleTimeString("ms-MY", { hour: "2-digit", minute: "2-digit" })}`); }
    render(); if (!$("#vres").hidden) showVoucher();
  }, err => { clearTimeout(timer); setStatus(err.code === "revoked" ? "" : "Rekod tak dapat dimuatkan."); });
})();
</script>
